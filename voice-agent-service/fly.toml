app = "finalcrm-os-voice"
primary_region = "sin"

# LiveKit Agents worker. It maintains an OUTBOUND connection to LiveKit Cloud to
# receive call jobs — there is no inbound HTTP/websocket to expose, so no
# [http_service]. LiveKit Cloud handles all SIP + real-time media. Keep one
# machine always running so it is registered and ready to take calls.

[build]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
